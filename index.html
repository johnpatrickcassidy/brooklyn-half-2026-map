<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brooklyn Half Marathon Road Closures</title>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=map" />
</head>

<body>
    <div id="app">
        <aside id="sidebar">
            <header>
                <h1>Brooklyn Half Closures</h1>
                <p>Select a street to view closure details.</p>
                <div class="slider-container">
                    <label for="time-slider">Time: <span id="time-display">7:00 AM</span></label>
                    <input type="range" id="time-slider" min="-1" max="900" value="420" step="1">
                </div>
            </header>
            <ul id="closure-list">
                <!-- List items will be dynamically inserted here -->
            </ul>
        </aside>
        <main id="map-container" style="position: relative;">
            <div id="map"></div>
            <!-- Floating Persistent Map Legend -->
            <div class="map-legend" id="map-legend">
                <h4>
                    <span class="legend-title-text">Map Legend</span>
                    <span class="material-symbols-outlined legend-title-icon" style="display: none;">map</span>
                    <span class="chevron">▼</span>
                </h4>
                <div class="legend-inner-items">
                    <div class="legend-item">
                        <div class="legend-icon closure-line"></div>
                        <span>Street closures</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-icon course-ribbon">
                            <div class="ribbon-core"></div>
                        </div>
                        <span>Race course</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-icon runner-swarm">
                            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                        </div>
                        <span>Running pack</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-icon checkpoint-badge">M#</div>
                        <span>Mile markers</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Configuration Secrets -->
    <script src="config.js"></script>
    <!-- Google Maps JS API Bootstrap Loader -->
    <script>
        (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
            key: CONFIG.GOOGLE_MAPS_API_KEY,
            v: "weekly",
        });
    </script>
    <!-- Data and Application Logic -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
